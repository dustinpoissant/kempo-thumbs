# Database for kempo-thumbs' own test suite. The other kempo repos have already claimed 5433
# (kempo-demo), 5434 (kempo), 5435 (kempo-media) and 5436 (kempo-files), so this one takes 5437 —
# they can all be up at once.
services:
  postgres:
    image: postgres:16-alpine
    container_name: kempo-thumbs-test-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kempo
      POSTGRES_PASSWORD: kempo
      POSTGRES_DB: kempo_thumbs_test
    ports:
      - "5437:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kempo"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_test_data:
